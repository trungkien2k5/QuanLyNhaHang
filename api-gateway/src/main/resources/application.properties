spring.application.name=api-gateway
server.port=8080

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Restaurant Service
spring.cloud.gateway.server.webmvc.routes[0].id=restaurant-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://RESTAURANT-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/restaurant/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

# Reservation Service
spring.cloud.gateway.server.webmvc.routes[1].id=reservation-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://RESERVATION-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/reservation/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1

# Payment Service
spring.cloud.gateway.server.webmvc.routes[2].id=payment-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/payment/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=1

# Auth Service
spring.cloud.gateway.server.webmvc.routes[3].id=auth-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/auth/**